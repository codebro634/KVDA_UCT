pairings:

  - pair:
      - agents: [pruned_oga,oga_eps]
      - models: [recon,man,tam,st,gol,aa,sa,tr,eo,sw_15,saving]

  - pair:
      - agents: [deterministic,deterministic_eps_a]
      - models: [hoth,hc4,hpus,hcon,dwlp,dpushyl,drecon,dman,dtam,dst,dgol,daa,dsa,dtr,deo,dsw_15,dele,dwf,drfbe,dsaving]
